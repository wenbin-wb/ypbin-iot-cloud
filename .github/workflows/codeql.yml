name: CodeQL

# 触发方式：push / PR / 每周一次。
#
# 注：GitHub 的 code scanning 对**公开仓库免费**、对私有仓库需要 GitHub Advanced Security。
# 本仓若转为私有且未开通 GHAS，需要把这些触发注释掉、改为仅 workflow_dispatch ——
# 否则每次 push 都会以「Code scanning is not enabled for this repository」失败
# （一个永远红的检查只会训练人忽略红灯）。
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # CodeQL 在分析后会去读 workflow run 信息（遥测）；**仓库转私有后**默认 token
  # 不再具备该权限，会以「Resource not accessible by integration」+「configuration error」失败。
  # 显式声明 actions: read 即可。
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 与 ci.yml 同一理由：P4b 起依赖未发布的 cn.ypbin:ypbin-iot-bom，构建前必须先本地安装 iot-starter。
      - name: 检出 iot-starter（P4b 依赖，未发布，需本地安装）
        uses: actions/checkout@v7
        with:
          repository: wenbin-wb/ypbin-iot-starter
          path: sources/ypbin-iot-starter

      - name: 安装 iot-starter 到本地仓库
        run: mvn -B -ntp -fae -DskipTests install -f sources/ypbin-iot-starter/pom.xml

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: 构建（CodeQL 需要真实编译产物）
        run: mvn -B -ntp clean compile -DskipTests

      - name: 执行分析
        uses: github/codeql-action/analyze@v4
